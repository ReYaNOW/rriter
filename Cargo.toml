[package]
name = "rriter"
version = "0.1.0"
edition = "2021"

[dependencies]
winit = { version = "0.30.13", features = ["wayland"] }
glutin = "0.32.3"
glutin-winit = "0.5.0"
glow = "0.17.0"
fontdue = "0.9.3"
swash = "0.2.7"
arboard = { version = "3.3", default-features = false, features = [
    "wayland-data-control",
] }
bytemuck = "1.14"
dlmalloc = { version = "0.2.6", features = ["global"] }
image = "0.25.1"
rfd = { version = "0.17", default-features = false, features = [
    "xdg-portal",
    "pollster",
] }

# Синтаксическая подсветка
tree-sitter = "0.26.8"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-bash = "0.25.1"
tree-sitter-javascript = "0.25.0"
tree-sitter-java = "0.23.0"
tree-sitter-c-sharp = "0.23.0"
tree-sitter-dart-orchard = "0.3.2"
tree-sitter-toml-ng = "0.7.0"
syntect = { version = "5.3.0", default-features = false, features = [
    "default-syntaxes",
    "regex-onig",
    "default-themes",
] }
regex = "1.12.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
