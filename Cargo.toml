cargo-features = ["panic-immediate-abort"]

[package]
name = "rriter"
version = "0.1.0"
edition = "2024"

[dependencies]
glow = "0.17.0"
swash = "0.2.7"
bytemuck = "1.14"
rustc-hash = "2.1.2"

# Оптимизированные графические библиотеки (только PNG, без лишних сканеров шрифтов)
image = { version = "0.25.1", default-features = false, features = ["png"] }
resvg = { version = "0.47.0", default-features = false }
usvg = { version = "0.47.0", default-features = false }
tiny-skia = "0.12"

# Синтаксическая подсветка
tree-sitter = "0.26.9"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-bash = "0.25.1"
tree-sitter-javascript = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-dart = "0.1.0"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-html = "0.23.2"
tree-sitter-css = "0.25.0"
tree-sitter-json = '0.24.8'
tree-sitter-c = '0.24.2'
tree-sitter-cpp = '0.23.4'
tree-sitter-regex = '0.25.0'
tree-sitter-typescript = '0.23.2'
tree-sitter-make = '1.1.1'
imara-diff = "0.2.0"
regex = { version = "1.12.3", default-features = false, features = ["std"] }
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
rayon = "1.12.0"
once_cell = "1.19"
ignore = "0.4"
globset = "0.4"
memchr = "2"
lexical-sort = "0.3"
notify-debouncer-mini = "0.7.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
url = "2.5.8"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
    "http2",
    "gzip",
    "json",
] }
memmap2 = "0.9.10"
alacritty_terminal = "0.26.0"
portable-pty = "0.9.0"
git2 = "0.20"

[features]
default = []
linux-io-uring-bench = []
linux-x11 = [
    "glutin/glx",
    "glutin/x11",
    "glutin-winit/glx",
    "glutin-winit/x11",
    "winit/x11",
]

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.3", default-features = false, features = [
    "wayland-data-control",
] }
rfd = { version = "0.17", default-features = false, features = [
    "xdg-portal",
    "pollster",
] }
io-uring = "0.7"
winit = { version = "0.30.13", default-features = false, features = [
    "wayland",
] }
glutin = { version = "0.32.3", default-features = false, features = [
    "egl",
    "wayland",
] }
glutin-winit = { version = "0.5.0", default-features = false, features = [
    "egl",
    "wayland",
] }


[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_os = "linux"))'.dependencies]
arboard = { version = "3.3", default-features = false }
rfd = { version = "0.17", default-features = false }
winit = "0.30.13"
glutin = "0.32.3"
glutin-winit = "0.5.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "api_fetch_bench"
path = "src/bin/api_fetch_bench.rs"

[[bin]]
name = "project_search_io_uring_bench"
path = "src/bin/project_search_io_uring_bench.rs"
required-features = ["linux-io-uring-bench"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
